[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-mcts"
version = "0.1.0"
description = "Federated Monte Carlo Tree Search for Large Language Model Inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shunyu Yao", email = "shunyuyao.cs@gmail.com" }]
license = { text = "MIT License" }
keywords = ["tree-search", "large-language-models", "llm", "prompting", "tree-of-thoughts", "mcts", "federated-learning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=0.27.7,<1.0.0",
    "backoff>=2.2.1",
    "numpy>=1.24.3",
    "sympy>=1.12",
    "tqdm>=4.65.0",
    "pandas>=2.0.3",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[project.urls]
Homepage = "https://github.com/princeton-nlp/tree-of-thought-llm"

[project.scripts]
fmcts-run = "federated_mcts.cli:run_main"
fmcts-exp = "federated_mcts.cli:exp_main"

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
